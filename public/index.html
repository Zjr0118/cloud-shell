<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GitHub Actions 云端 Shell (macos-14)</title>
<style>
  body{font-family:Menlo,Consolas,monospace;background:#0d1117;color:#c9d1d9;padding:20px;max-width:900px;margin:0 auto}
  h2{color:#58a6ff}
  .row{display:flex;gap:8px;margin:12px 0}
  input{flex:1;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:15px}
  button{background:#238636;color:#fff;border:none;border-radius:6px;padding:10px 18px;cursor:pointer;font-size:15px}
  button:hover{background:#2ea043}
  button:disabled{opacity:.5;cursor:not-allowed}
  #out{white-space:pre-wrap;background:#010409;border:1px solid #30363d;border-radius:6px;padding:14px;margin-top:14px;min-height:320px;font-size:13px;line-height:1.5}
  #status{color:#8b949e;font-size:13px;margin-top:8px}
  .ok{color:#3fb950}.err{color:#f85149}
  details{margin-top:14px;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:13px}
  details summary{cursor:pointer;color:#58a6ff}
</style>
</head>
<body>
<h2>云端 Shell · GitHub Actions macos-14</h2>
<p>网页输入命令 → 触发 GitHub Actions runner（macOS 14）执行 → 自动拉取结果回显。</p>
<div class="row">
  <input id="cmd" placeholder="例如：uname -a; sw_vers; whoami" />
  <button id="btn" onclick="run()">执行</button>
</div>
<div id="status"></div>
<div id="out"></div>

<details>
  <summary>常见命令示例</summary>
  <code>
    uname -a<br>
    sw_vers<br>
    whoami; hostname; pwd<br>
    curl -s ifconfig.me<br>
    ls -la ~<br>
    echo "hello from cloud mac"
  </code>
</details>

<script>
let polling = false;

async function run(){
  const cmd = document.getElementById('cmd').value.trim();
  if(!cmd){ out('请输入命令','err'); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true;
  out('正在触发 GitHub Actions 云端 runner（macos-14）...','');
  const tr = await fetch('/trigger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
  const td = await tr.json();
  if(!td.ok){ out('❌ 触发失败：'+JSON.stringify(td.err),'err'); btn.disabled=false; return; }
  // 轮询状态，直到完成
  polling = true;
  let guard = 0;
  while(polling && guard < 120){
    guard++;
    const sr = await fetch('/status');
    const sd = await sr.json();
    if(!sd.found){ setStatus('尚未找到运行记录...'); await sleep(3000); continue; }
    setStatus(`运行 #${sd.id}  状态: ${sd.status}${sd.conclusion? '  结论: '+sd.conclusion:''}`);
    if(sd.status === 'completed'){
      polling = false;
      const rr = await fetch('/result');
      const rd = await rr.json();
      if(rd.found){ out(rd.content,'ok'); }
      else if(rd.err){ out('取结果失败：'+rd.err,'err'); }
      else { out('运行已完成，但未取到结果。'+ (rd.msg||''),'err'); }
      btn.disabled=false;
      return;
    }
    await sleep(5000);
  }
  polling=false; btn.disabled=false;
  setStatus('轮询超时，请稍后手动查看：https://github.com/Zjr0118/cloud-shell/actions');
}

function out(t,cls){ document.getElementById('out').innerHTML=''; appendOut(t,cls); }
function appendOut(t,cls){
  const o=document.getElementById('out');
  o.innerHTML += `<span class="${cls||''}"></span>` + t.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '\n';
}
function setStatus(t){ document.getElementById('status').textContent = t; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
</script>
</body>
</html>
